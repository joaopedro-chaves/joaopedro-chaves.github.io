# Hugo configuration file
title: JoãoPedroChaves.io

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Blog
      pageRef: /blog
      weight: 1
    - name: Projetos
      pageRef: /projects
      weight: 2
    - name: Docs
      pageRef: /docs
      weight: 3
    - name: Sobre mim
      pageRef: /about
      weight: 4
    - name: Contato
      url: "https://github.com/joaopedro-chaves"
      weight: 5
    - name: Buscar
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/joaopedro-chaves/joaopedro-chaves.github.io"
      params:
        icon: github
    - name: Instagram
      weight: 8
      url: "https://instagram.com/joaopedro.254"
      params:
        icon: instagram

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: false
    base: ""
